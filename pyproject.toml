[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist"
version = "0.3.0"
description = "IT5006 Group 6 Olist delivery analytics: shared data, feature, modelling and EDA code"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
include = ["olist*"]
